name: package-smoke
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[dev]'
      - run: python -m pip check
      - run: python examples/training_quickstart.py
      - run: python -m unittest discover -s tests -p 'test_training_example.py'
      - run: python tools/check_release.py . --edition core
