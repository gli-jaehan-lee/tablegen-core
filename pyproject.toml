[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tablegen-core"
version = "0.2.0"
description = "Standalone synthetic table generator with 24 selected priors"
readme = "README.md"
license = { text = "BSD-3-Clause AND Apache-2.0" }
authors = [{ name = "Gauss Labs Inc." }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "torch>=2.1,<3", "scipy>=1.11,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
tablegen-core = "tablegen_core.cli:main"
tablegen-core-gui = "tablegen_core.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tablegen_core = ["*.json", "*.md", "licenses/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE", "licenses/*"]
